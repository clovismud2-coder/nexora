
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEXORA - Universal Business Management System">
  <title>NEXORA | Business Management</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #20233a;
    }

    header {
      background: #171b32;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      letter-spacing: 3px;
    }

    header p {
      margin-top: 8px;
      color: #c5c8dc;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 15px #00000010;
    }

    .welcome h2 {
      margin-bottom: 12px;
    }

    .welcome p {
      color: #666;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      background: #e7f8ed;
      color: #168344;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>NEXORA</h1>
    <p>UNIVERSAL BUSINESS MANAGEMENT</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Bienvenue sur NEXORA 👋</h2>
      <p>
        Votre espace intelligent pour gérer,
        organiser et développer votre entreprise.
      </p>
      <div class="status">Plateforme initialisée</div>
    </section>
  </main>

</body>
</html>
